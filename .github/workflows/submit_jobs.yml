name: Run daily fetch with SPECTER2

on:
  schedule:
      - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-specter2-fetch
  cancel-in-progress: true

jobs:
  run-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      SPECTER2_CACHE_DIR: ${{ github.workspace }}/.cache/specter2-reference-cache
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11 and pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-specter.txt

      - name: Restore Hugging Face model cache
        uses: actions/cache@v5
        with:
          path: ${{ env.HF_HOME }}
          key: >-
            specter2-hf-${{ runner.os }}-3447645e1def-2081559630a8-${{
            hashFiles('requirements-specter.txt') }}

      - name: Restore reference metadata and embeddings
        uses: actions/cache@v5
        with:
          path: ${{ env.SPECTER2_CACHE_DIR }}
          key: >-
            specter2-reference-v1-${{ runner.os }}-cf953b074ee6-3447645e1def-2081559630a8-shared

      - name: Install libxml build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-specter.txt

      - name: Verify SPECTER2 and downstream integration
        run: python -m pytest -q tests/test_specter_rank.py tests/test_daily_specter.py

      - name: Run fetching, SPECTER2 ranking, and existing email delivery
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PW: ${{ secrets.MY_PW }}
          MY_EMAIL_2: ${{ secrets.MY_EMAIL_2 }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -c "from run import main; main(1, test_mode=False, relevance_backend='specter2', specter2_top_n=25)"
