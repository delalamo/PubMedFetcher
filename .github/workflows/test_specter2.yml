name: Test SPECTER2 paper ranking

on:
  # Temporary branch trigger used only to validate this new workflow before it
  # exists on the default branch. Removed after the GitHub-hosted test passes.
  push:
    branches:
      - codex/specter2-evaluation
  workflow_dispatch:
    inputs:
      mode:
        description: Candidate source to evaluate
        required: true
        type: choice
        options:
          - backtest
          - live
        default: backtest
      lookback_days:
        description: Days to retrieve in live mode
        required: true
        type: number
        default: 7
      max_candidates:
        description: Maximum papers to rank in live mode
        required: true
        type: number
        default: 300
      top_n:
        description: Number of ranked papers in the job summary
        required: true
        type: number
        default: 25
      rebuild_reference_cache:
        description: Ignore cached reference metadata and embeddings
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: specter2-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      SPECTER2_CACHE_DIR: ${{ github.workspace }}/.cache/specter2-reference-cache
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11 and pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-specter.txt

      - name: Restore Hugging Face model cache
        uses: actions/cache@v5
        with:
          path: ${{ env.HF_HOME }}
          key: >-
            specter2-hf-${{ runner.os }}-3447645e1def-2081559630a8-${{
            hashFiles('requirements-specter.txt') }}

      - name: Restore reference metadata and embeddings
        id: reference-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.SPECTER2_CACHE_DIR }}
          key: >-
            specter2-reference-v1-${{ runner.os }}-cf953b074ee6-3447645e1def-2081559630a8-${{
            inputs.rebuild_reference_cache && github.run_id || 'shared' }}

      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-specter.txt

      - name: Run unit tests
        run: python -m pytest -q tests/test_specter_rank.py

      - name: Verify pinned SPECTER2 model loading and inference
        run: python specter_smoke.py --fixture tests/fixtures/specter2_smoke.json

      - name: Run ranking evaluation
        shell: bash
        run: |
          rebuild_args=()
          if [[ "${{ inputs.rebuild_reference_cache }}" == "true" ]]; then
            rebuild_args+=(--rebuild-reference-cache)
          fi
          python specter_rank.py \
            --mode "${{ inputs.mode || 'backtest' }}" \
            --lookback-days "${{ inputs.lookback_days || 7 }}" \
            --max-candidates "${{ inputs.max_candidates || 300 }}" \
            --top-n "${{ inputs.top_n || 25 }}" \
            --cache-dir "${SPECTER2_CACHE_DIR}" \
            --output-dir specter2-reports \
            --actions-cache-hit "${{ steps.reference-cache.outputs.cache-hit || 'false' }}" \
            "${rebuild_args[@]}"

      - name: Add report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f specter2-reports/summary.md ]]; then
            cat specter2-reports/summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "SPECTER2 evaluation stopped before a report was written." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload complete SPECTER2 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: specter2-${{ inputs.mode || 'backtest' }}-${{ github.run_id }}
          path: specter2-reports/
          if-no-files-found: warn
          retention-days: 30
